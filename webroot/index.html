<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>CODM FPS</title>
<style>
:root{
  --bg:#000000; --panel:#0b0c0f; --line:#22252d; --text:#eef0f5; --muted:#8a93a6; --sel:#14161b; --chip:#14161b; --chip-line:#2b2e37;
  --accent:#e0a43a; --accent-ink:#1a1304; --ok:#6fcf97; --err:#ff7a7a;
  --num:"sans-serif-condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f1ec; --panel:#ffffff; --line:#d9d4c8; --text:#1d2230; --muted:#5d6678; --sel:#eef0f4; --chip:#eceef2; --chip-line:#cfd3dc;
         --accent:#b87a10; --accent-ink:#ffffff; --ok:#22804a; --err:#c0392b; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 170px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
h1{font-size:1.5rem;margin:0;letter-spacing:.2px}
.sub{margin:0 0 20px;color:var(--muted);font-size:.95rem}
.status{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px}
.status b{font-family:var(--num);font-size:1.6rem;font-weight:700;color:var(--accent);margin-right:6px}
.status small{display:block;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.status small.pend{color:var(--accent)}
fieldset{border:0;margin:0;padding:0}
legend{font-weight:600;margin-bottom:10px;padding:0}
.opt{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
  transition:border-color .15s,background-color .15s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .n{font-family:var(--num);font-size:2.4rem;font-weight:700;line-height:1;min-width:3.4ch;text-align:right}
.opt .n i{font-style:normal;font-size:.9rem;font-weight:500;color:var(--muted);margin-left:4px}
.opt .d{flex:1;min-width:0}
.opt .d span{display:block;font-weight:600}
.opt .d small{color:var(--muted)}
.opt .d small.modes{font-weight:700;color:var(--text)}
.opt:has(input:checked){border-color:var(--accent);background:var(--sel)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){opacity:.6}
.opt.off .n{font-size:1.3rem;font-family:inherit;text-align:left;min-width:0;font-weight:600}
.opt .n.max{font-size:1.25rem;min-width:4.6rem;text-align:center;letter-spacing:.4px}
.opt .d .games{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.opt .d .games .chip,.opt .d button.chip{display:inline-block;font-size:.78rem;font-weight:600;line-height:1.3;padding:2px 9px;
  border-radius:999px;background:var(--chip);
  border:1px solid var(--chip-line);color:var(--text)}
.opt .d button.chip{width:auto;font-family:inherit;background:transparent;border-style:dashed;color:var(--muted);cursor:pointer}
.opt .d .games .nogames{font-weight:400;color:var(--muted);font-size:.9rem}
fieldset + fieldset{margin-top:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .opt{margin-bottom:0}
.opt.compact{padding:10px 12px;gap:0;min-width:0}
.opt.compact .d span{font-size:.9rem;line-height:1.25;overflow-wrap:anywhere}
.opt.compact .d small{display:block;font-size:.75rem;line-height:1.25;overflow-wrap:anywhere}
.grid2.wide-last .opt:last-child:nth-child(odd){grid-column:1 / -1}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(12px,env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 35%)}
.bar > div{max-width:560px;margin:0 auto}
button{width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;
  background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600;padding:11px 8px}
button small{display:block;font-weight:400;font-size:.75rem;color:var(--muted);margin-top:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
button.lang{width:auto;flex:none;display:flex;align-items:center;padding:6px 8px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line)}
button.lang img,button.lang svg{display:block;height:26px;width:auto}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(0,0,0,.6);z-index:10}
.modal.show{display:flex}
.modal .box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.modal h2{margin:0 0 8px;font-size:1.1rem}
.modal p{margin:0 0 18px;color:var(--muted);font-size:.95rem}
.modal .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.support{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--panel);color:var(--text);
  border:1px solid var(--line);font-weight:600;padding:10px 12px}
.support img{height:30px;width:auto;display:block}
.supportwrap{margin-top:12px}
.supportwrap + fieldset{margin-top:22px}
.ffnote{margin:10px 2px 0;color:var(--muted);font-size:.85rem;line-height:1.4}
.sheet .box{max-width:420px;max-height:90vh;overflow:auto;position:relative;padding:14px}
.sheet .hero{display:block;width:100%;height:auto;border-radius:10px;margin-bottom:12px}
.sheet .x{position:absolute;top:22px;right:22px;width:34px;height:34px;padding:0;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:1.2rem;line-height:1}
.sheet p{margin:0 0 12px;color:var(--text);font-size:.95rem;overflow-wrap:anywhere}
.sheet a{color:var(--accent)}
.sheet button.copy{display:inline;width:auto;padding:1px 8px;border-radius:8px;background:var(--chip);color:var(--text);
  border:1px solid var(--chip-line);font-family:ui-monospace,Menlo,monospace;font-size:.88rem;font-weight:600;text-align:left;overflow-wrap:anywhere}
.sheet button.copy.small{font-size:.74rem;padding:1px 6px}
.sheet .go{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.sheet .go a{display:block;text-align:center;text-decoration:none;font-weight:700;padding:12px;border-radius:12px;
  background:var(--panel);color:var(--text);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.9rem;z-index:20;display:none}
.toast.show{display:block}
#msg{min-height:1.4em;margin:0 0 10px;text-align:center;font-size:.95rem}
#msg.ok{color:var(--ok)} #msg.err{color:var(--err)}
@media (prefers-reduced-motion:reduce){.opt{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Spoof Root Temporary</h1>
    <button id="langBtn" class="lang" type="button"></button>
  </div>
  <p class="sub" data-i18n="sub"></p>

  <section class="status" aria-live="polite">
    <b id="cur">…</b><span id="curLabel"></span>
    <small id="curProps"></small>
    <small id="curPending" class="pend"></small>
    <small id="curSoft" class="pend"></small>
  </section>

  <div id="opts"></div>
</main>

<div class="bar"><div>
  <p id="msg" role="status"></p>
  <div class="pair">
    <button id="softBtn" class="ghost" type="button"><span data-i18n="soft"></span><small data-i18n="softSub"></small></button>
    <button id="rebootBtn" class="ghost" type="button"><span data-i18n="reboot"></span><small data-i18n="rebootSub"></small></button>
  </div>
</div></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mText">
  <div class="box">
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div class="acts">
      <button id="mNo" class="ghost" type="button" data-i18n="cancel"></button>
      <button id="mYes" type="button" data-i18n="restart"></button>
    </div>
  </div>
</div>

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  // El botón muestra la bandera del idioma al que se cambia
  const b = $('langBtn');
  b.innerHTML = lang === 'en' ? PERU : USA;
  b.setAttribute('aria-label', t('switchTo'));
  b.setAttribute('title', t('switchTo'));
  $('sheet').setAttribute('aria-label', t('supportBtn'));
  $('sheetX').setAttribute('aria-label', t('close'));
  if (loaded) render(); else $('curLabel').textContent = t('reading');
}

      // Vista previa fuera del gestor de módulos
      return resolve({errno:0, stdout:
        'FPS=144\n@@\n120|Lenovo TB-9707F|lenovo|Lenovo Legion Y700|120|120\n144|V2417A|vivo|Vivo iQOO Z9 Turbo+|144|90\n165|PLK110|OnePlus|OnePlus 15|165|90\n@@\nV2417A\nvivo\n@@\nRedmi K60|Xiaomi\n@@\nksud\n@@\nff144|Infinix X6891|INFINIX|Infinix GT 50 Pro 5G|144\nff120|RMX5070|realme|Realme 14 5G|120\n@@\nmg_REDMAGIC_9_PRO|NX769J|ZTE|REDMAGIC 9 Pro|Brawl Stars;Diablo Immortal;Shadow Fight 3;Netflix\nmg_PIXEL_9|Pixel 9|Google|Pixel 9|\n', stderr:''});
    }
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    window[cb] = (errno, stdout, stderr) => { delete window[cb]; resolve({errno, stdout, stderr}); };
    ksu.exec(cmd, '{}', cb);
  });
}

function say(text, kind){ const m = $('msg'); m.textContent = text; m.className = kind || ''; }

async function load(){
  const r = await run(`cd ${MOD} && cat config 2>/dev/null; echo @@; cat profiles.conf; echo @@; getprop ro.product.model; getprop ro.product.manufacturer; echo @@; cat defaults.conf 2>/dev/null; echo @@; sh ${MOD}/apply.sh softcheck; echo @@; cat freefire.conf 2>/dev/null; echo @@; cat games.conf 2>/dev/null; echo @@; cat apps.conf 2>/dev/null; echo @@; cat more.conf 2>/dev/null`);
  const parts = r.stdout.split('@@\n');
  if (parts.length < 4) { say(t('errLoad'), 'err'); return; }
  const m = /FPS=(\S+)/.exec(parts[0]);
  active = m ? m[1] : null;
  const rows = txt => (txt || '').trim().split('\n').filter(Boolean).map(l => l.split('|'));
  codm = rows(parts[1]).map(([id, model, maker, label, mj, br]) => ({id, kind: 'codm', model, maker, label, mj: mj || id, br: br || id}));
  ff = rows(parts[5]).map(([id, model, maker, label, fps]) => ({id, kind: 'ff', model, maker, label, fps: fps || ''}));
  more = rows(parts[6]).map(([id, model, maker, label, games]) => ({id, kind: 'more', model, maker, label, games: games ? games.split(';').filter(Boolean) : []}));
  apps = rows(parts[7]).map(([id, model, maker, label, app]) => ({id, kind: 'apps', model, maker, label, app}));
  spoofs = rows(parts[8]).map(([id, model, maker, label]) => ({id, kind: 'spoof', model, maker, label}));
  profiles = [...codm, ...ff, ...apps, ...more, ...spoofs];
  const [model, maker] = parts[2].trim().split('\n');
  const [dm, df] = parts[3].trim().split('|');
  defaults = {model: dm || '', maker: df || ''};
  reported = {model: model || '', maker: maker || ''};
  softOk = /^(ksud|userspace)$/.test((parts[4] || '').trim());
  loaded = true;
  render();
}

const esc = v => String(v).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const expanded = new Set(), SHOW = 3;

function render(){
  const cur = $('cur'), lab = $('curLabel');
  const p = profiles.find(x => x.id === active);
  const expected = active === 'default' ? defaults : (p ? {model: p.model, maker: p.maker} : null);
  if (active === 'default') { cur.textContent = t('original'); lab.textContent = t('defaultsName'); }
  else if (p && p.kind === 'apps') { cur.textContent = p.app; lab.textContent = p.label; }
  else if (p && p.kind === 'spoof') { cur.textContent = p.label; lab.textContent = ''; }
  else if (p) { cur.textContent = p.kind === 'more' ? 'MAXFPS' : (p.kind === 'codm' ? p.id : p.fps) + ' FPS'; lab.textContent = p.label; }
  else { cur.textContent = '—'; lab.textContent = t('none'); }
  $('curProps').textContent = t('reports') + (reported.maker || '?') + ' ' + (reported.model || '?');
  const pend = expected && (expected.model !== reported.model || expected.maker !== reported.maker);
  $('curPending').textContent = pend ? t(softOk ? 'pending' : 'pendingFull') : '';
  $('curSoft').textContent = softOk ? '' : t('softUnsupported');

  selected = active;
  const box = $('opts'); box.innerHTML = '';
  section(box, t('legendCodm'), codm.map(x => option({id: x.id, big: x.id, unit: 'FPS', title: esc(x.label), sub: 'MJ: ' + x.mj + 'fps - BR: ' + x.br + 'fps', bold: true})));
  box.appendChild(supportBtn());
  section(box, t('legendFF'), ff.map(x => option({id: x.id, big: x.fps, unit: 'FPS', title: esc(x.label)})));
  if (ff.length) {
    const nf = document.createElement('p'); nf.className = 'ffnote'; nf.setAttribute('data-i18n', 'ffNote'); nf.textContent = t('ffNote');
    box.lastElementChild.appendChild(nf);
  }
  section(box, t('legendMore'), more.map(x => option({id: x.id, big: 'MAXFPS', max: true, games: x.games, sub: x.label})));
  section(box, t('legendApps'), apps.map(x => option({id: x.id, title: esc(x.app), sub: x.label, compact: true})), 'grid2');
  section(box, t('legendSpoof'), spoofs.map(x => option({id: x.id, title: esc(x.label), compact: true})), 'grid2 wide-last');
  if (defaults.model) {
    section(box, t('legendOrig'), [option({id: 'default', big: t('original'), off: true, title: esc(t('defaultsName')), sub: defaults.model + ' (' + defaults.maker + ')'})]);
  }
}

function section(box, title, opts, grid){
  if (!opts.length) return;
  const f = document.createElement('fieldset');
  const lg = document.createElement('legend'); lg.textContent = title; f.appendChild(lg);
  let into = f;
  if (grid) { into = document.createElement('div'); into.className = grid; f.appendChild(into); }
  opts.forEach(o => into.appendChild(o));
  box.appendChild(f);
}

function option(o){
  const l = document.createElement('label');
  l.className = 'opt' + (o.off ? ' off' : '') + (o.compact ? ' compact' : '');
  const big = o.big === undefined ? '' : `<span class="n${o.max ? ' max' : ''}">${esc(o.big)}${o.unit ? '<i>' + o.unit + '</i>' : ''}</span>`;
  l.innerHTML = `<input type="radio" name="fps" value="${esc(o.id)}"${o.id === selected ? ' checked' : ''}>
    ${big}
    <span class="d">${o.games ? '<span class="games"></span>' : '<span>' + o.title + '</span>'}${o.sub ? '<small' + (o.bold ? ' class="modes"' : '') + '>' + esc(o.sub) + '</small>' : ''}</span>`;
  l.querySelector('input').addEventListener('change', e => choose(e.target.value));
  if (o.games) drawGames(l.querySelector('.games'), o.id, o.games);
  return l;
}

// Nombres de los juegos como etiquetas; las primeras SHOW y un botón para ver el resto
function drawGames(box, id, games){
  box.innerHTML = '';
  if (!games.length) { box.innerHTML = '<span class="nogames">' + esc(t('noGames')) + '</span>'; return; }
  const open = expanded.has(id);
  (open ? games : games.slice(0, SHOW)).forEach(g => {
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = g; box.appendChild(c);
  });
  if (games.length > SHOW) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.textContent = open ? t('less') : t('moreGames').replace('{n}', games.length - SHOW);
    b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); if (open) expanded.delete(id); else expanded.add(id); drawGames(box, id, games); });
    box.appendChild(b);
  }
}

function supportBtn(){
  const w = document.createElement('div'); w.className = 'supportwrap';
  const b = document.createElement('button'); b.type = 'button'; b.className = 'support';
  b.innerHTML = '<img alt="" src="' + CP_ICON + '"><span>' + esc(t('supportBtn')) + '</span>';
  b.addEventListener('click', openSheet);
  w.appendChild(b);
  return w;
}

let sheetFocus = null;
function openSheet(){ sheetFocus = document.activeElement; $('sheet').classList.add('show'); $('sheetX').focus(); }
function closeSheet(){ $('sheet').classList.remove('show'); if (sheetFocus && sheetFocus.focus) sheetFocus.focus(); }

// Abre enlaces con el navegador del sistema (am start); si no se puede, window.open
function openUrl(url){
  if (window.ksu && typeof ksu.exec === 'function') {
    run(`am start --user 0 -a android.intent.action.VIEW -d '${url}' >/dev/null 2>&1`).then(r => { if (r.errno) window.open(url, '_blank'); });
  } else { window.open(url, '_blank'); }
}

let toastTimer = null;
function toast(text){
  const el = $('toast'); el.textContent = text; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

async function copyText(v){
  let ok = false;
  try { await navigator.clipboard.writeText(v); ok = true; } catch (e) {}
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = v; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  toast(t(ok ? 'copied' : 'copyFail'));
}

$('sheet').addEventListener('click', e => {
  const a = e.target.closest ? e.target.closest('a') : null;
  if (a) { e.preventDefault(); openUrl(a.href); return; }
  const c = e.target.closest ? e.target.closest('[data-copy]') : null;
  if (c) { copyText(c.dataset.copy); return; }
  if (e.target.id === 'sheet' || e.target.id === 'sheetX') closeSheet();
});

async function choose(value){
  document.querySelectorAll('#opts input').forEach(i => i.disabled = true);
  say(t('saving'));
  const r = await run(`sh ${MOD}/apply.sh ${value}`);
  const f = (r.stdout || '').trim().split('\n').pop().split('|');
  if (f[0] === 'OK') {
    const pr = profiles.find(q => q.id === value);
    const x = value === 'default' ? t('savedDefault') : (pr ? (pr.kind === 'apps' ? pr.app + ' - ' + pr.label : pr.label) : value);
    say(t(softOk ? 'saved' : 'savedFull').replace('{x}', x), 'ok');
  } else {
    say(f[0] === 'ERR' ? f[1] : (r.stderr || t('errSave')), 'err');
  }
  await load();
}

let pending = null, lastFocus = null;
function ask(title, text, action){
  pending = action; lastFocus = document.activeElement;
  $('mTitle').textContent = title; $('mText').textContent = text;
  $('modal').classList.add('show'); $('mNo').focus();
}
function closeAsk(){ $('modal').classList.remove('show'); pending = null; if (lastFocus) lastFocus.focus(); }
$('mNo').addEventListener('click', closeAsk);
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeAsk(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (pending) closeAsk(); else if ($('sheet').classList.contains('show')) closeSheet();
});
$('mYes').addEventListener('click', async () => {
  const a = pending; closeAsk();
  if (!a) return;
  say(a === 'soft' ? t('doingSoft') : t('doingReboot'), 'ok');
  const r = await run(`sh ${MOD}/apply.sh ${a}`);
  const f = (r.stdout || '').trim().split('\n').pop().split('|');
  if (f[0] === 'ERR') {
    say(f[1] === 'unsupported' ? t('softUnsupported') : f[1] === 'noeffect' ? t('softNoEffect') : f[1], 'err');
  }
});
$('softBtn').addEventListener('click', () => ask(t('mSoftTitle'), t('mSoftText'), 'soft'));
$('rebootBtn').addEventListener('click', () => ask(t('mRebootTitle'), t('mRebootText'), 'reboot'));

$('langBtn').addEventListener('click', () => {
  lang = lang === 'en' ? 'es' : 'en';
  try { localStorage.setItem('codm_lang', lang); } catch (e) {}
  say('');
  applyLang();
});

applyLang();
load();
</script>
